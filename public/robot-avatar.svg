<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="250" cy="465" rx="85" ry="14" fill="url(#shadowGrad)"/>

  <!-- Left Arm -->
  <path d="M 130 200 C 95 240, 85 300, 115 365 C 130 375, 150 355, 145 325 C 135 285, 145 245, 160 215 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="108" cy="235" rx="20" ry="32" fill="#cbd5e1" opacity="0.5"/>

  <!-- Right Arm -->
  <path d="M 370 200 C 405 240, 415 300, 385 365 C 370 375, 350 355, 355 325 C 365 285, 355 245, 340 215 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="392" cy="235" rx="20" ry="32" fill="#cbd5e1" opacity="0.5"/>

  <!-- Lower Body / Torso -->
  <path d="M 160 210 Q 250 180 340 210 Q 370 290 320 380 Q 250 435 180 380 Q 130 290 160 210 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Chest Detail Ring & Cyan Core -->
  <ellipse cx="250" cy="305" rx="30" ry="30" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3"/>
  <ellipse cx="250" cy="305" rx="23" ry="23" fill="url(#cyanCore)" filter="url(#glowFilter)"/>
  <ellipse cx="245" cy="300" rx="8" ry="5" fill="#ffffff" opacity="0.6"/>

  <!-- Left Ear / Antenna Node -->
  <rect x="90" y="100" width="30" height="60" rx="15" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Right Ear / Antenna Node -->
  <rect x="380" y="100" width="30" height="60" rx="15" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Head Outer Shell -->
  <ellipse cx="250" cy="130" rx="150" ry="105" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Top Cyan Head Cap -->
  <path d="M 190 40 Q 250 30 310 40 Q 295 72 250 75 Q 205 72 190 40 Z" fill="url(#cyanGlow)" filter="url(#glowFilter)"/>

  <!-- Black Visor Face Screen -->
  <rect x="135" y="70" width="230" height="110" rx="55" fill="url(#visorGrad)" stroke="#334155" stroke-width="3"/>

  <!-- Cyan Smiling Curved Eyes -->
  <!-- Left Eye: Arc -->
  <path d="M 175 125 A 24 24 0 0 1 223 125 A 24 12 0 0 0 175 125 Z" fill="url(#eyeGlow)" filter="url(#glowFilter)"/>
  
  <!-- Right Eye: Arc -->
  <path d="M 277 125 A 24 24 0 0 1 325 125 A 24 12 0 0 0 277 125 Z" fill="url(#eyeGlow)" filter="url(#glowFilter)"/>

  <!-- Highlights on Visor -->
  <ellipse cx="250" cy="82" rx="60" ry="6" fill="#ffffff" opacity="0.15"/>
</svg>
